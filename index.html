<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before the page paints (dark by default)
      try { var t = localStorage.getItem("pst_theme") || "dark"; if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.dataset.theme = t } catch (e) { document.documentElement.dataset.theme = "dark" }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pharmacy Service Tracker</title>
    <meta name="description" content="Log pharmacy services, invoice them and follow up on payments." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
      </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
