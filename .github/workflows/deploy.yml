name: Publish site (GitHub address)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tax, National Insurance, mileage, Making Tax Digital and invoice tests must pass before anything goes live
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BUILD: ${{ github.sha }}
      - run: cp dist/index.html dist/404.html
      # Once the site is live on kasarx.co.uk, set the repository variable MOVED_TO_DOMAIN to "true":
      # this address then only redirects there, and the old installed app clears itself.
      - name: Replace with a redirect to kasarx.co.uk
        if: vars.MOVED_TO_DOMAIN == 'true'
        run: |
          rm -rf dist && mkdir dist
          cp moved/index.html dist/index.html
          cp moved/index.html dist/404.html
          cp moved/index.html dist/privacy.html
          cp moved/index.html dist/changelog.html
          cp moved/sw.js dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
